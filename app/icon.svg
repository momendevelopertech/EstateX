    <rect x="60" y="200" width="60" height="240" rx="4" fill="white"/>
    <rect x="135" y="140" width="55" height="300" rx="4" fill="white"/>
    <rect x="205" y="180" width="65" height="260" rx="4" fill="white"/>
    <rect x="285" y="110" width="60" height="330" rx="4" fill="white"/>
    <rect x="360" y="160" width="55" height="280" rx="4" fill="white"/>
  </g>
  <!-- E letter -->
  <text x="256" y="340" font-family="system-ui,-apple-system,sans-serif" font-weight="900" font-size="260" fill="white" text-anchor="middle" dominant-baseline="central">E</text>
